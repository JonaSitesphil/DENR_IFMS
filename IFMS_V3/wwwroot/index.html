<body>
    <div id="app">
        <div id="app" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
            <img src="Sample-data/DENR.png"
                 alt="Loading..."
                 style="width: 120px; height: 120px; animation: pulse 2s infinite ease-in-out;" />
            <style>
                @keyframes pulse {
                    0% {
                        transform: scale(1);
                        opacity: 1;
                    }

                    50% {
                        transform: scale(1.1);
                        opacity: 0.8;
                    }

                    100% {
                        transform: scale(1);
                        opacity: 1;
                    }
                }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui">
